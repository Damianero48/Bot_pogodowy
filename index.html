<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather AI Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="theme-toggle">
        <button id="theme-btn" aria-label="Przełącz tryb" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <main class="chat-container">
        <header class="chat-header">
            <div class="bot-info">
                <div class="bot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div>
                    <h1>Weather AI Assistant</h1>
                    <p class="status">Online | Twój doradca modowy</p>
                </div>
            </div>
        </header>

        <section id="chat-box" class="chat-box" aria-live="polite">
            <div class="message bot-message">
                Cześć! Jestem Twoim osobistym asystentem pogodowym. Wpisz nazwę miasta (np. <i>Kraków</i>), aby pobrać aktualne dane, albo napisz mi, jaka u Ciebie pogoda (np. <i>"jest zimno i pada deszcz"</i>), a doradzę Ci idealny ubiór!
            </div>
        </section>

        <div id="typing-indicator" class="typing-indicator hidden">
            <span></span><span></span><span></span>
        </div>

        <footer class="chat-input-area">
            <input type="text" id="user-input" placeholder="Wpisz miasto lub opisz pogodę..." onkeypress="handleKeyPress(event)" aria-label="Wiadomość do bota">
            <button onclick="sendMessage()" aria-label="Wyślij">
                <i class="fas fa-paper-plane"></i>
            </button>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
